<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sultaniqz</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
}

/* HEADER */
header {
    height: 80px;
    background: #080808;
    border-bottom: 2px solid #e60012;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 25px;
}

.logo-text {
    font-size: 28px;
    font-weight: bold;
    color: white;
}

.logo-text span {
    color: #ff1025;
}

nav {
    display: flex;
    gap: 12px;
    margin-left: auto;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 10px;
    transition: 0.3s;
}

nav a:hover,
nav a.active {
    background: #e60012;
}

/* HERO IMAGE */
.hero {
    width: calc(100% - 30px);
    margin: 20px auto;
    height: 270px;
    border: 2px solid #e60012;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(230,0,18,0.35);
    background: #080808;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* SEARCH */
.search-box {
    width: calc(100% - 60px);
    margin: 25px auto;
    display: flex;
    gap: 10px;
}

.search-box input {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #e60012;
    background: #0c0c0c;
    color: white;
    outline: none;
    font-size: 16px;
}

.search-box button {
    padding: 0 30px;
    border: none;
    border-radius: 12px;
    background: #e60012;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

/* SECTION */
.section {
    width: calc(100% - 60px);
    margin: 35px auto;
}

.section-title {
    font-size: 25px;
    margin-bottom: 20px;
    border-left: 5px solid #e60012;
    padding-left: 12px;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.product {
    background: #0b0b0b;
    border: 1px solid #e60012;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(230,0,18,0.12);
}

.product-image {
    height: 180px;
    background: #111;
}

.product-info {
    padding: 15px;
}

.product-info h3 {
    margin-bottom: 8px;
}

.price {
    color: #ff172b;
    font-size: 20px;
    font-weight: bold;
}

.buy {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: none;
    border-radius: 9px;
    background: #e60012;
    color: white;
    font-weight: bold;
}

/* FOOTER */
footer {
    margin-top: 60px;
    padding: 30px;
    text-align: center;
    border-top: 2px solid #e60012;
    background: #080808;
    color: #888;
}

/* MOBILE */
@media (max-width: 800px) {

    header {
        height: auto;
        padding: 18px;
        flex-direction: column;
    }

    nav {
        margin-left: 0;
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero {
        height: 180px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    .search-box {
        width: calc(100% - 30px);
    }

    .section {
        width: calc(100% - 30px);
    }
}

@media (max-width: 480px) {

    .products {
        grid-template-columns: 1fr;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        padding: 14px;
    }
}
</style>
</head>
